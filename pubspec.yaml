name: downtube
description: "DownTube - YouTube Video & MP3 Downloader"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  # HTTP for the innertube manifest client (VISIONOS player requests,
  # plain ranged media downloads).
  http: ^1.6.0
  logging: ^1.3.0
  # Local YouTube extraction (no server needed, works on all platforms).
  # Upstream is unmaintained; pinned to the community fix for the new
  # playlist lockupViewModel layout (Hexer10#381 → PR #380).
  youtube_explode_dart:
    git:
      url: https://github.com/elias001011/youtube_explode_dart.git
      ref: fix/playlist-lockup-view-model
  permission_handler: ^11.3.0
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
